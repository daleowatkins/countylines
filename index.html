            const localOps = Object.entries(operations).filter(([_, op]) => op.locationId === location.id);

                let total = 0;
                total += crew.roadman * CREW_CONFIG.roadman.dailyWage;
                total += crew.coerced * CREW_CONFIG.coerced.dailyWage;
                total += crew.blackmailed * CREW_CONFIG.blackmailed.dailyWage;

                    const type = op.crewType || 'coerced'; 
                    total += (CREW_CONFIG[type]?.dailyWage || 0);
                });
                // Gang Leader: -1% total wages per level
                const wageModifier = 1 - (skills.operations.gangLeader * 0.01);
                return Math.floor(total * Math.max(0.5, wageModifier));

                // DETERMINE RAIDS
                const newEvents = [];
                
                Object.keys(operations).forEach(opId => {
                    const op = operations[opId];
                    let raidChance = op.risk / 4; 
                    
                    // Apply skill modifiers
                    // Neighbourhood Watch: -2% raid risk per level
                    raidChance *= (1 - (skills.logistics.neighborhood * 0.02));
                    // The Fall Guy: Second chance on investigation
                    if (skills.network.senator && fallGuyUsed) raidChance = 0; // Still get immunity after first use
                    
                    if (Math.random() * 100 < raidChance) {
                        let stockLost = 0;
                        productsConfig.forEach(p => {
                            stockLost += (op.stock[p.id] || 0) + ((op.processing[p.id] || 0) * p.conversion);
                        });

                        newEvents.push({
                            type: 'raid',
                            opId: opId,
                            locationId: op.locationId,
                            cashAtRisk: op.cash,
                            stockAtRisk: Math.floor(stockLost)
                        });
                        // Raids spike investigation
                        setInvestigation(inv => Math.min(1000, inv + 50));
                    }
                });

                setEventQueue(prev => [...prev, ...newEvents]);

                setOperations(prevOps => {
                    const nextOps = { ...prevOps };
                    Object.keys(nextOps).forEach(opId => {
                        const op = { ...nextOps[opId], processing: { ...nextOps[opId].processing } };
                        if (op.hasGrow) {
                            op.processing['p1'] = (op.processing['p1'] || 0) + (0.1 * daysPassed); 
                        }
                        nextOps[opId] = op;
                    });
                    return nextOps;
                });

                // Safe House: chance to pause investigation for 1 day per level
                if (skills.intelligence.safeHouse > 0) {
                    for (let i = 0; i < daysPassed; i++) {
                        const pauseChance = skills.intelligence.safeHouse; // 1% per level
                        if (Math.random() * 100 < pauseChance) {
                            setInvestigationPausedUntil(totalHours + 24); // Pause for 24 hours
                            addLog(`🏠 Safe House: Investigation paused for 1 day!`);
                        }
                    }
                }

                // Balance: reduce bank interest to 0.01% per day
                const interestEarned = Math.floor(bank * 0.0001 * daysPassed);
                if (interestEarned > 0) {
                    setBank(b => b + interestEarned);
                    addLog(`🏦 Bank Interest: +${formatMoney(interestEarned)}`);
                }

                // Fixers Network: auto-reduce investigation by 1 point per level per day
                if (skills.intelligence.fixers > 0) {
                    const reduceBy = skills.intelligence.fixers * daysPassed; // 1-10 per day
                    setInvestigation(inv => Math.max(0, inv - reduceBy));
                }

                if (debt > 0) {
                    const debtInterest = Math.floor(currentDebt * 0.01 * daysPassed);
                    setDebt(d => d + debtInterest);
                    if (debtInterest > 0) addLog(`📉 Debt increased by ${formatMoney(debtInterest)}.`);
                }
                
                setStress(s => Math.max(0, s - (10 * daysPassed)));
            };

            const resolveLondonEvent = (choice, eventData) => {
                const action = eventData.options.find(o => o.action === choice);
                if (!action) {
                    setEventQueue(prev => prev.slice(1));
                    return;
                }

                if (choice === 'ignore') {
                    addLog("Ignored opportunity.");
                } else if (choice === 'raid_grow') {
                    setInventory(inv => ({ ...inv, 'p1': (inv['p1'] || 0) + 8 })); // 8lbs Weed
                    addLog("Raided the grow. +8lbs Weed secured.");
                    if (Math.random() < 0.3) {
                        setInvestigation(inv => Math.min(1000, inv + 250));
                        addLog("WARNING: Locals saw you. Heat +250.");
                    }
                } else if (choice === 'raid_trap') {
                    if (cash < 200) {
                        addLog("Couldn't afford the tip. Missed out.");
                    } else {
                        if (Math.random() < 0.05) {
                            setModal({
                                title: "AMBUSH",
                                message: "It was a setup. You got rushed by 5 guys with shanks.\n\nGAME OVER.",
                                type: 'gameover',
                                image: "betrayed.png"
                            });
                            localStorage.removeItem('countyLinesSave_v10');
                            return;
                        }
                        setCash(c => c - 200 + Math.floor(2000 + Math.random() * 3000));
                        setInventory(inv => ({ ...inv, 'p4': (inv['p4'] || 0) + 4 })); // 4kg Heroin
                        addLog("Hit the trap. Got 4kg Heroin and cleared the safe.");
                    }
                } else if (choice === 'buy_cheap_coke') {
                    if (cash < 500) {
                        addLog("Couldn't afford the deal.");
                    } else {
                        setCash(c => c - 500);
                        if (Math.random() < 0.1) {
                            addLog("SCAMMED. The brick was just crushed drywall.");
                        } else {
                            setInventory(inv => ({ ...inv, 'p2': (inv['p2'] || 0) + 5 })); // 5kg Coke
                            addLog("Deal done. +5kg Coke secured.");
                        }
                    }
                } else if (choice === 'intercept_accept') {
                    if (cash < 100) {
                        addLog("Couldn't afford the £100.");
                    } else {
                        setCash(c => c - 100);
                        if (Math.random() < 0.1) {
                            addLog("SCAMMED. That was just washing powder.");
                        } else {
                            setInventory(inv => ({ ...inv, 'p3': (inv['p3'] || 0) + 1 })); // 1kg Speed
                            addLog("The Intercept scored. +1kg Speed (£1.5k value).");
                        }
                    }
                } else if (choice === 'drought_run') {
                    if (cash < 50) {
                        addLog("Couldn't afford the train ticket.");
                    } else {
                        setCash(c => c - 50);
                        if (Math.random() < 0.25) {
                            const newInv = {};
                            productsConfig.forEach(p => newInv[p.id] = 0);
                            setInventory(newInv);
                            addLog("BUSTED. Transport Police stopped the train. Lost all inventory.");
                        } else {
                            addLog("Made the run. Countryside is eating. +300% sales prices (5 days).");
                            // 5 days = 120 hours boost
                            localStorage.setItem('droughtBoostEnd', (totalHours + 120).toString());
                        }
                    }
                } else if (choice === 'feature_join') {
                    if (cash < 200) {
                        addLog("Couldn't afford the cameraman fee.");
                    } else {
                        setCash(c => c - 200);
                        if (Math.random() < 0.3) {
                            const healthLoss = Math.floor(health * 0.5);
                            setHealth(h => Math.max(0, h - healthLoss));
                            addLog("It was a setup. Got jumped on camera. -50% Health.");
                        } else {
                            addLog("Cameo was fire. Clout up. +2x sales speed (7 days).");
                            // 7 days = 168 hours boost
                            localStorage.setItem('featureBoostEnd', (totalHours + 168).toString());
                        }
                    }
                } else if (choice === 'insider_invest') {
                    if (cash < 5000) {
                        addLog("Couldn't afford the £5k investment.");
                    } else {
                        setCash(c => c - 5000);
                        if (Math.random() < 0.4) {
                            addLog("RUG PULL. Your cousin ghosted. Lost the £5k.");
                        } else {
                            setCash(c => c + 100000);
                            addLog("BLESSED. Coin pumped hard. +£100k profit (returned in 24h).");
                        }
                    }
                } else if (choice === 'fire_grab') {
                    if (Math.random() < 0.1) {
                        // 10% death
                        setModal({
                            title: "TRAPPED",
                            message: "The floor collapsed. You couldn't escape.\n\nGAME OVER.",
                            type: 'gameover',
                            image: "betrayed.png"
                        });
                        localStorage.removeItem('countyLinesSave_v10');
                        return;
                    } else if (Math.random() < 0.3) {
                        // 30% smoke inhalation (of the remaining 90%)
                        setHealth(h => Math.max(0, h - 20));
                        addLog("Grabbed 5lbs High-Grade Weed. Smoke inhalation. -20 Health.");
                        setInventory(inv => ({ ...inv, 'p1': (inv['p1'] || 0) + 5 }));
                    } else {
                        // 60% clean success
                        setInventory(inv => ({ ...inv, 'p1': (inv['p1'] || 0) + 5 }));
                        addLog("Grabbed 5lbs High-Grade Weed before it burned.");
                    }
                }

                setEventQueue(prev => prev.slice(1));
            };

            const resolveRaid = (choice) => {
                const currentEvent = eventQueue[0];
                if (!currentEvent) return;

                // Handle London Opportunity
                if (currentEvent.type === 'london_opportunity') {
                    resolveLondonEvent(choice, currentEvent.data);
                    return;
                }

                // Handle Pulled Over Events
                if (currentEvent.type === 'pulled_over') {
                    handlePulledOverChoice(choice);
                    setEventQueue(prev => prev.slice(1));
                    return;
                }

                const op = operations[currentEvent.opId];
                if (!op) {
                    setEventQueue(prev => prev.slice(1));
                    return;
                }

                const locName = LOCATIONS.find(l=>l.id===op.locationId)?.name;
                const opName = OPERATION_TYPES[op.type].name;
                let logMsg = "";

                if (choice === 'flush') {
                    const saveCash = Math.random() < 0.75;
                    const cashSaved = saveCash ? op.cash : 0;
                    
                    if (saveCash) {
                        setCash(c => c + cashSaved); 
                        logMsg = `Raid in ${locName}: Flushed stash. Saved ${formatMoney(cashSaved)}. Runner escaped.`;
                    } else {
                        logMsg = `Raid in ${locName}: Flushed stash. Cash seized. Runner escaped.`;
                    }
                    setCrew(prev => ({ ...prev, [op.crewType]: prev[op.crewType] + 1 }));

                } else if (choice === 'escape') {
                    const saveStock = Math.random() < 0.75;

                    if (saveStock) {
                        setInventory(prev => {
                            const newInv = { ...prev };
                            productsConfig.forEach(p => {
                                const processedUnits = (op.stock[p.id] || 0) / p.conversion; 
                                const processingUnits = op.processing[p.id] || 0;
                                newInv[p.id] = (newInv[p.id] || 0) + processedUnits + processingUnits;
                            });
                            return newInv;
                        });
                        logMsg = `Raid in ${locName}: Escaped with stock. Lost cash. Runner escaped.`;
                    } else {
                        logMsg = `Raid in ${locName}: Fumbled escape. Lost everything. Runner escaped.`;
                    }
                    setCrew(prev => ({ ...prev, [op.crewType]: prev[op.crewType] + 1 }));

                } else if (choice === 'fallguy') {
                    setCash(c => c + op.cash);
                    setInventory(prev => {
                        const newInv = { ...prev };
                        productsConfig.forEach(p => {
                            const processedUnits = (op.stock[p.id] || 0) / p.conversion; 
                            const processingUnits = op.processing[p.id] || 0;
                            newInv[p.id] = (newInv[p.id] || 0) + processedUnits + processingUnits;
                        });
                        return newInv;
                    });
                    setBannedLocations(prev => ({ ...prev, [op.locationId]: day + 7 }));
                    logMsg = `Raid in ${locName}: Used Fall Guy. Saved assets. Runner jailed. Town HOT.`;
                }

                setOperations(prev => {
                    const next = { ...prev };
                    delete next[currentEvent.opId];
                    return next;
                });

                addLog(logMsg);
                setEventQueue(prev => prev.slice(1));
            };

            const handlePulledOverChoice = (choice) => {
                if (choice === 'run') {
                    // Escape chance depends on vehicle
                    let escChance = vehicle ? vehicle.escapeChance : 0.2; 
                    // Mechanic: +2% escape chance per level (cap at 95%)
                    escChance = Math.min(0.95, escChance + (skills.logistics.mechanic * 0.02));
                    if (Math.random() < escChance) {
                        setInvestigation(inv => Math.min(1000, inv + 50));
                        addLog(`ESCAPED! You floored it. The ${vehicle.name} left them in the dust. (+50 Heat)`);
                    } else {
                        setInvestigation(1000); // Game Over next tick
                        setModal({ title: "BUSTED", message: "Failed to outrun the feds. Arrested.", type: 'gameover', image: "prison.png" });
                    }
                } else if (choice === 'ditch') {
                    if (Math.random() < 0.8) {
                        const emptyInv = {};
                        productsConfig.forEach(p => emptyInv[p.id] = 0);
                        setInventory(emptyInv);
                        setVehicle(null);
                        addLog("Ditched stash & car. Walked away clean.");
                    } else {
                        setInvestigation(1000);
                        setModal({ title: "BUSTED", message: "Officer saw you toss the bag. Arrested.", type: 'gameover', image: "prison.png" });
                    }
                } else if (choice === 'pull_over') {
                    if (Math.random() < 0.2) {
                        addLog("Officer checked ID and let you go. Close one.");
                    } else {
                        setInvestigation(1000);
                        setModal({ title: "BUSTED", message: "Officer searched the car. Found the work. Arrested.", type: 'gameover', image: "prison.png" });
                    }
                }
            };
            
            const getEventContent = (evt) => {
                let title = "";
                let message = "";
                let image = "carsmoke.png";
                let options = [];

                if (evt.type === 'london_opportunity') {
                    title = evt.data.title;
                    message = evt.data.message;
                    image = evt.data.image || "carsmoke.png";
                    options = evt.data.options.map(opt => ({
                        label: opt.label,
                        desc: opt.desc,
                        style: opt.style,
                        handler: () => resolveLondonEvent(opt.action, evt.data)
                    }));
                } else if (evt.type === 'pulled_over') {
                    title = "PULLED OVER";
                    message = `Feds are behind you.\nCurrent Vehicle: ${vehicle ? vehicle.name : 'Unknown'}`;
                    image = "siren.png";
                    options = [
                        { label: "Floor It", desc: "Try to outrun. Risk Game Over.", style: "red", handler: () => resolveRaid('run') },
                        { label: "Ditch & Run", desc: "Lose Car & Stock. 80% Survival.", style: "yellow", handler: () => resolveRaid('ditch') },
                        { label: "Pull Over", desc: "Hope they don't search. 20% Success.", style: "blue", handler: () => resolveRaid('pull_over') }
                    ];
                } else if (evt.type === 'raid') {
                    const locName = LOCATIONS.find(l=>l.id===evt.locationId)?.name || "Trap House";
                    title = "RAID IN PROGRESS";
                    image = "raid.png";
                    message = `${locName}\nAssets at Risk:\nCash: ${formatMoney(evt.cashAtRisk)}\nStock: ${evt.stockAtRisk} units`;
                    options = [
                        { label: "Flush Stash", desc: "Destroy stock. Save Cash (75%). Runner escapes.", style: "blue", handler: () => resolveRaid('flush') },
                        { label: "Escape out Back", desc: "Keep Stock (75%). Lose Cash. Runner escapes.", style: "yellow", handler: () => resolveRaid('escape') },
                        { label: "Use Fall Guy", desc: "Keep All. Runner Jailed. Area Hot (7 days).", style: "green", handler: () => resolveRaid('fallguy') }
                    ];
                }

                return { title, message, image, options };
            };
            
            // --- Helper for Images ---
            const getImgSrc = (imgName) => {
                 // Try default path first, if error, fallback to 'countylines/assets/'
                 // Note: The onError in the <img> tag handles the fallback logic dynamically.
                 // We return the primary path here.
                 return `assets/${imgName}`;
            };

            const performAction = (action) => {
                if (cash < action.cost) {
                    setModal({ title: "Skint", message: "You can't afford that.", type: 'error' });
                    return;
                }
                const newHealth = Math.min(100, Math.max(0, health + action.health));
                setCash(c => c - action.cost);
                setStress(s => Math.max(0, s + action.stress)); 
                setHealth(newHealth);
                setStrength(s => Math.min(100, s + action.strength));
                setIntel(i => Math.min(100, i + action.intel));
                
                // Handle Lay Low investigation pause
                if (action.id === 'laylow') {
                    setInvestigationPausedUntil(totalHours + action.time);
                }
                
                if (newHealth <= 0) {
                    setModal({ title: "HOSPITALIZED", message: "You passed out. Woke up in A&E.\nLost 24 hours.", type: 'error', image: "wasted.png" });
                    passTime(24, true); 
                } else {
                    setModal(null);
                    passTime(action.time, true);
                    addLog(`Action: ${action.name}.`);
                }
            };

            const performHeatAction = (action) => {
                if (cash < action.cost) {
                    setModal({ title: "Skint", message: "You can't afford that.", type: 'error' });
                    return;
                }
                
                // Check Cooldown - FIX
                const lastUsed = actionCooldowns[action.id] || 0;
                if (day < lastUsed + action.cooldownDays) {
                    setModal({ title: "Cooldown", message: `Can't do this yet. Wait ${lastUsed + action.cooldownDays - day} more days.`, type: 'error' });
                    return;
                }

                setCash(c => c - action.cost);
                
                // Handle Success/Fail
                if (Math.random() > action.chance) {
                    // Fail
                    if (action.failPenalty) {
                        setInvestigation(inv => Math.min(1000, inv + action.failPenalty));
                        addLog(`FAILED: ${action.name} went wrong! Heat +${action.failPenalty}.`);
                    } else {
                        addLog(`FAILED: ${action.name} didn't work.`);
                    }
                } else {
                    // Success
                    const pauseTime = action.pauseHours || 0;
                    const newPauseUntil = Math.max(totalHours, investigationPausedUntil) + pauseTime;
                    setInvestigationPausedUntil(newPauseUntil);
                    addLog(`SUCCESS: ${action.name}. Investigation stalled for ${pauseTime}h.`);
                }
                
                // Set Cooldown - FIX: Update state
                if (action.cooldownDays > 0) {
                    setActionCooldowns(prev => ({ ...prev, [action.id]: day }));
                }

                if (action.id === 'hotel_hide') {
                    passTime(24, true);
                } else {
                    passTime(1, true);
                }
            };

            const buyVehicle = (carKey) => {
                if (modal || eventQueue.length > 0) return;
                const car = VEHICLES[carKey];
                if (cash < car.cost) {
                    setModal({ title: "Funds", message: "Can't afford this whip.", type: 'error' });
                    return;
                }
                setCash(c => c - car.cost);
                setVehicle(car);
                addLog(`Bought a ${car.name}.`);
            };

            const travelTo = (targetLocation, mode) => {
                if (modal || eventQueue.length > 0) return; 
                if (targetLocation.id === location.id) return;
                
                // Check Car Ownership
                if (mode === 'car' && !vehicle) {
                    setModal({ title: "No Whip", message: "You need to buy a car first.", type: 'error' });
                    return;
                }

                const details = calculateTravelDetails(targetLocation);
                const { hours, cost, risk } = details[mode];
                
                if (cash < cost) {
                    setModal({ title: "Skint", message: `You need ${formatMoney(cost)} for the ${mode}.`, type: 'error' });
                    return;
                }

                if (stress >= 100) {
                    setModal({ title: "Mental Breakdown", message: "Too stressed to travel.", type: 'error' });
                    return;
                }

                // Pulled Over Check (Car Only)
                // Traffic School: -2% pull over risk per level
                const pullOverChance = Math.max(0, 0.15 - (skills.logistics.traffic * 0.02));
                if (mode === 'car' && Math.random() < pullOverChance) {
                     setEventQueue(prev => [...prev, { type: 'pulled_over' }]);
                     // Don't execute travel yet
                     return;
                }

                // NEW: Random London Opportunity (5% chance)
                if (targetLocation.id === 'lon' && Math.random() < 0.05) {
                    const londonEvents = customEvents.filter(e => !e.trigger || e.trigger === 'london');
                    if (londonEvents.length > 0) {
                        const randomEvent = londonEvents[Math.floor(Math.random() * londonEvents.length)];
                        setEventQueue(prev => [...prev, { type: 'london_opportunity', data: randomEvent }]);
                    }
                    // Note: Travel cost/time is applied below, then event shows.
                }

                if (mode === 'free') {
                    if (Math.random() < 0.05) { 
                        const newInv = {};
                        productsConfig.forEach(p => newInv[p.id] = 0);
                        setInventory(newInv); 
                        setModal({
                            title: "CAUGHT",
                            message: "Caught fare dodging. Police seized your bag.",
                            type: 'error',
                            image: "prison.png"
                        });
                        addLog("Caught bumping transport. Inventory seized.");
                        setInvestigation(inv => Math.min(1000, inv + 50));
                    }
                }

                setCash(c => c - cost);
                setStress(s => Math.min(100, s + 5 + (hours * 1)));
                setLocation(targetLocation);
                passTime(hours, true, mode); // Pass 'mode' to double heat if car
                addLog(`Arrived in ${targetLocation.name}.`);
                
                if (targetLocation.id === 'lon') setActiveTab('market');
                else setActiveTab('empire'); 
            };

            // Helper: Get effective price with skill bonuses
            const getEffectivePrice = (basePrice, priceType) => {
                let multiplier = 1.0;
                if (priceType === 'buy') {
                    // Haggler: -1% buy price per level
                    multiplier *= (1 - (skills.operations.haggler * 0.01));
                } else if (priceType === 'sell') {
                    // Chemist: +1% sell price per level
                    multiplier *= (1 + (skills.operations.chemist * 0.01));
                }
                return Math.floor(basePrice * multiplier);
            };

            const buyProduct = (prodId) => {
                if (modal || eventQueue.length > 0) return;
                if (location.id !== 'lon') return;
                const priceData = prices[location.id]?.[prodId];
                if (!priceData) return;
                const effectiveBuyPrice = getEffectivePrice(priceData.buy, 'buy');
                const maxBuy = Math.floor(cash / effectiveBuyPrice);
                if (maxBuy <= 0) return;
                let timeCost = 0; // Updated to 0 hours
                const amount = 1; 
                setCash(c => c - (effectiveBuyPrice * amount));
                setInventory(inv => ({ ...inv, [prodId]: (inv[prodId] || 0) + amount }));
                passTime(timeCost);
            };

            const recruitCrew = (type) => {
                if (modal || eventQueue.length > 0) return;
                const banDay = bannedLocations[location.id];
                if (banDay && day < banDay) {
                    setModal({ title: "Area Too Hot", message: `Town banned until Day ${banDay}.`, type: 'error' });
                    return;
                }
                
                const config = CREW_CONFIG[type];
                if (!config) return;

                if (cash < config.recruitCost) {
                    setModal({ title: "Funds Needed", message: `Need ${formatMoney(config.recruitCost)}.`, type: 'error' });
                    return;
                }
                
                // Eye Test: -1.5% snitch risk per level
                const snitchChance = Math.max(0, (config.riskMod / 100) - (skills.network.eyetest * 0.015));
                
                // Check if crew member is a snitch
                if (Math.random() < snitchChance) {
                    setModal({
                        title: "SNITCH DETECTED",
                        message: `${config.label} was a fed informant. Aborted recruitment.`,
                        type: "error"
                    });
                    passTime(0.5);
                    return;
                }
                
                setCash(c => c - config.recruitCost);
                setCrew(prev => ({ ...prev, [type]: (prev[type] || 0) + 1 }));
                addLog(`Recruited: ${config.label}.`);
                
                passTime(1);
            };

            const setupOperation = (typeKey) => {
                if (modal || eventQueue.length > 0) return;
                if (location.type === 'city') return;
                
                let selectedCrewType = null;
                // Priority: Roadman > Coerced > Blackmailed > Loyal
                if (crew.roadman > 0) selectedCrewType = 'roadman';
                else if (crew.coerced > 0) selectedCrewType = 'coerced';
                else if (crew.blackmailed > 0) selectedCrewType = 'blackmailed';
                else if (crew.loyal > 0) selectedCrewType = 'loyal';

                if (!selectedCrewType) {
                    setModal({ title: "No Staff", message: "Recruit a runner first.", type: 'error' });
                    return;
                }

                const opData = OPERATION_TYPES[typeKey];
                if (cash < opData.cost) {
                    setModal({ title: "Funds", message: `Need ${formatMoney(opData.cost)}.`, type: 'error' });
                    return;
                }

                setCash(c => c - opData.cost);
                setCrew(prev => ({ ...prev, [selectedCrewType]: prev[selectedCrewType] - 1 }));
                
                // Establishing ops adds investigation
                setInvestigation(i => Math.min(1000, i + 50));

                const initialRisk = CREW_CONFIG[selectedCrewType].riskMod; 
                const newOpId = `op_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                const initialStock = {};
                const initialProcessing = {};
                const initialSold = {};
                productsConfig.forEach(p => {
                    initialStock[p.id] = 0;
                    initialProcessing[p.id] = 0;
                    initialSold[p.id] = 0;
                });

                setOperations(prev => ({
                    ...prev,
                    [newOpId]: { 
                        locationId: location.id,
                        type: typeKey, 
                        stock: initialStock, 
                        processing: initialProcessing, 
                        sold: initialSold,
                        cash: 0, 
                        risk: initialRisk, 
                        hasGrow: false,
                        crewType: selectedCrewType
                    }
                }));
                passTime(4);
                addLog(`Established ${opData.name} with ${CREW_CONFIG[selectedCrewType].label}.`);
            };

            const manageOp_Restock = (opId, prodId) => {
                if (modal || eventQueue.length > 0) return;
                const amount = transferAmounts[`${opId}_${prodId}`] || 0;
                if (amount <= 0) return;
                if (inventory[prodId] < amount) return;

                passTime(1); 
                setInventory(prev => ({ ...prev, [prodId]: prev[prodId] - amount }));
                setOperations(prev => ({
                    ...prev,
                    [opId]: {
                        ...prev[opId],
                        processing: { 
                            ...prev[opId].processing, 
                            [prodId]: (prev[opId].processing[prodId] || 0) + amount 
                        }
                    }
                }));
                setTransferAmounts(prev => ({ ...prev, [`${opId}_${prodId}`]: 0 }));
            };

            const dropAllStock = (opId, prodId) => {
                if (modal || eventQueue.length > 0) return;
                const amount = inventory[prodId] || 0;
                if (amount <= 0) return;

                passTime(1); 
                setInventory(prev => ({ ...prev, [prodId]: 0 }));
                setOperations(prev => ({
                    ...prev,
                    [opId]: {
                        ...prev[opId],
                        processing: { 
                            ...prev[opId].processing, 
                            [prodId]: (prev[opId].processing[prodId] || 0) + amount 
                        }
                    }
                }));
            };

            const manageOp_Collect = (opId) => {
                if (modal || eventQueue.length > 0) return;
                const op = operations[opId];
                if (!op || op.cash <= 0) return;
                
                const amount = op.cash;
                setCash(c => c + amount);
                const resetSold = {};
                productsConfig.forEach(p => resetSold[p.id] = 0);

                setOperations(prev => ({
                    ...prev,
                    [opId]: { ...prev[opId], cash: 0, sold: resetSold }
                }));
                addLog(`Collected ${formatMoney(amount)}.`);
            };

            const shutdownOp = (opId, mode) => {
                const op = operations[opId];
                
                if (mode === 'ask') {
                    setModal({
                        title: "Shut Down Trap House?",
                        message: `Recover all stock & cash (${formatMoney(op.cash)}).\n\nChoose how to proceed:`,
                        type: 'shutdown_confirm',
                        opId: opId
                    });
                    return;
                }

                // Calculate Recovery
                const recoveredCash = op.cash || 0;
                
                // Update Inventory with Recovered Stock
                setInventory(prev => {
                    const next = { ...prev };
                    productsConfig.forEach(p => {
                        const rawFromProcessing = op.processing[p.id] || 0;
                        const rawFromStock = (op.stock[p.id] || 0) / p.conversion;
                        const totalRaw = rawFromProcessing + rawFromStock;
                        if (totalRaw > 0) {
                            next[p.id] = (next[p.id] || 0) + totalRaw;
                        }
                    });
                    return next;
                });

                if (mode === 'abandon') {
                    setInvestigation(inv => Math.min(1000, inv + 100));
                    setCash(c => c + recoveredCash);
                    addLog(`Shut down ${OPERATION_TYPES[op.type].name}. Recovered ${formatMoney(recoveredCash)} & Stock. Heat +100.`);
                } else if (mode === 'cleanup') {

                    if ((cash + recoveredCash) < 1000) {

                        return;

                    setCash(c => c + recoveredCash - 1000);
                    addLog(`Shut down ${OPERATION_TYPES[op.type].name}. Recovered ${formatMoney(recoveredCash)} & Stock. Paid cleanup.`);
                }

                // Retrieve crew
                setCrew(prev => ({ ...prev, [op.crewType]: (prev[op.crewType] || 0) + 1 }));

                setOperations(prev => {
                    const next = { ...prev };
                    delete next[opId];
                    return next;
                });

                    [opId]: { ...prev[opId], hasGrow: true }

                                <div className="text-center"><div className="text-gray-500 text-[10px] uppercase mb-1">{CREW_CONFIG.coerced.label}</div><div className="text-xl font-bold text-yellow-500">{crew.coerced}</div><div className="text-[9px] text-gray-600">Wage: £{CREW_CONFIG.coerced.dailyWage * 7}/wk</div></div>
                                <div className="text-center"><div className="text-gray-500 text-[10px] uppercase mb-1">{CREW_CONFIG.blackmailed.label}</div><div className="text-xl font-bold text-red-500">{crew.blackmailed}</div><div className="text-[9px] text-gray-600">Wage: £{CREW_CONFIG.blackmailed.dailyWage * 7}/wk</div></div>
                                {crew.loyal > 0 && <div className="text-center"><div className="text-gray-500 text-[10px] uppercase mb-1">{CREW_CONFIG.loyal.label}</div><div className="text-xl font-bold text-blue-400">{crew.loyal}</div><div className="text-[9px] text-gray-600">Wage: £{CREW_CONFIG.loyal.dailyWage * 7}/wk</div></div>}
                            </div>
                            <div className="grid grid-cols-1 gap-2">
                                <button onClick={() => recruitCrew('roadman')} disabled={modal || eventQueue.length > 0} className="bg-indigo-900/30 hover:bg-indigo-900/50 text-indigo-300 text-[10px] py-3 rounded border border-indigo-900/50 flex items-center justify-between px-3 disabled:opacity-30 text-left">
                                    <div>
                                        <div className="font-bold">Recruit Exp. Roadman</div>
                                        <div className="text-xs text-indigo-400 font-bold uppercase mt-1">Wage: £{CREW_CONFIG.roadman.dailyWage * 7}/wk</div>
                                    </div>
                                    <div className="font-mono">£{CREW_CONFIG.roadman.recruitCost}</div>
                                </button>
                                <button onClick={() => recruitCrew('coerced')} disabled={modal || eventQueue.length > 0} className="bg-yellow-900/30 hover:bg-yellow-900/50 text-yellow-500 text-[10px] py-3 rounded border border-yellow-900/50 flex items-center justify-between px-3 disabled:opacity-30 text-left">
                                    <div>
                                        <div className="font-bold">Coerce Youth (3% Risk)</div>
                                        <div className="text-xs text-yellow-400 font-bold uppercase mt-1">Wage: £{CREW_CONFIG.coerced.dailyWage * 7}/wk</div>
                                    </div>
                                    <div className="font-mono">Free</div>
                                </button>
                                <button onClick={() => recruitCrew('blackmailed')} disabled={modal || eventQueue.length > 0} className="bg-red-900/30 hover:bg-red-900/50 text-red-500 text-[10px] py-3 rounded border border-red-900/50 flex items-center justify-between px-3 disabled:opacity-30 text-left">
                                    <div>
                                        <div className="font-bold">Blackmail Youth (+5% Risk)</div>
                                        <div className="text-xs text-red-400 font-bold uppercase mt-1">Wage: £{CREW_CONFIG.blackmailed.dailyWage * 7}/wk</div>
                                    </div>
                                    <div className="font-mono">Free</div>
                                </button>
                            </div>
                        </div>

                        <div className="space-y-4">
                            <div className="flex items-center justify-between">
                                <h3 className="font-bold text-white flex items-center gap-2"><MapPin size={16} /> {location.name} Ops</h3>
                                <button onClick={openActionMenu} disabled={modal || eventQueue.length > 0} className="flex items-center gap-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white px-2 py-1 rounded text-[10px] transition-colors disabled:opacity-30"><PlayCircle size={12} /> Actions</button>
                            </div>
                            {localOps.length === 0 && <div className="bg-gray-900/50 border border-dashed border-gray-800 p-4 rounded text-center text-gray-500 text-sm">No active lines in {location.name}.</div>}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {localOps.map(([opId, op]) => (
                                <div key={opId} className="bg-gradient-to-br from-gray-900 to-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg relative overflow-hidden">
                                    <div className="flex justify-between items-center border-b border-gray-700 pb-2 mb-3">
                                        <div className="flex flex-col"><span className="text-indigo-400 font-bold text-sm">{OPERATION_TYPES[op.type].name}</span><span className={`text-[10px] uppercase font-bold ${op.crewType === 'blackmailed' ? 'text-red-500' : op.crewType === 'coerced' ? 'text-yellow-500' : 'text-green-400'}`}>{CREW_CONFIG[op.crewType]?.label || 'Crew'}</span></div>
                                        {op.hasGrow && <span className="text-xs flex items-center gap-1 text-green-400 bg-green-900/30 px-2 py-1 rounded"><Sprout size={12}/> Grow</span>}
                                    </div>
                                    <div className="space-y-2 mb-4">
                                        <div className="grid grid-cols-5 gap-1 text-[9px] text-gray-500 uppercase font-bold text-center"><span className="text-left">Item</span><span>Bag</span><span>Unproc</span><span>Avail</span><span>Sold</span></div>
                                        {productsConfig.map(prod => {
                                            const processingDisplay = Math.floor(op.processing[prod.id] * 100) / 100;
                                            const bagAmount = inventory[prod.id] || 0;
                                            const transferKey = `${opId}_${prod.id}`;
                                            const transferVal = transferAmounts[transferKey] || 0;
                                            return (
                                            <div key={prod.id} className="bg-gray-950/50 p-2 rounded border border-gray-800/50">
                                                <div className="grid grid-cols-5 gap-1 items-center font-mono text-xs text-center mb-2">
                                                    <span className="text-left text-gray-300 font-sans font-bold">{prod.name}</span>
                                                    <span className="text-gray-400">{bagAmount}</span>
                                                    <div className="flex flex-col items-center leading-none"><span className="text-yellow-500">{processingDisplay}</span><span className="text-[7px] text-gray-600">{prod.label}</span></div>
                                                    <div className="flex flex-col items-center leading-none"><span className="text-green-500">{Math.floor(op.stock[prod.id])}</span><span className="text-[7px] text-gray-600">{prod.unit}</span></div>
                                                    <div className="flex flex-col items-center leading-none"><span className="text-blue-400">{(op.sold?.[prod.id] || 0)}</span><span className="text-[7px] text-gray-600">{prod.unit}</span></div>
                                                </div>
                                                {bagAmount > 0 && (
                                                    <div className="flex items-center gap-1 mt-1 justify-between bg-gray-900/80 p-1 rounded">
                                                        <div className="flex items-center gap-1">
                                                            <button onClick={() => updateTransferAmount(opId, prod.id, -1, bagAmount)} disabled={modal || eventQueue.length > 0} className="bg-gray-800 hover:bg-gray-700 text-white p-1 rounded"><Minus size={10}/></button>
                                                            <span className="w-8 text-center text-[10px] text-white border border-gray-700 rounded">{transferVal}</span>
                                                            <button onClick={() => updateTransferAmount(opId, prod.id, 1, bagAmount)} disabled={modal || eventQueue.length > 0} className="bg-gray-800 hover:bg-gray-700 text-white p-1 rounded"><Plus size={10}/></button>
                                                            <button onClick={() => updateTransferAmount(opId, prod.id, 'max', bagAmount)} disabled={modal || eventQueue.length > 0} className="bg-gray-800 hover:bg-gray-700 text-indigo-300 p-1 rounded text-[9px]"><Maximize2 size={10}/></button>
                                                        </div>
                                                        <div className="flex gap-1">
                                                            <button onClick={() => manageOp_Restock(opId, prod.id)} disabled={modal || transferVal <= 0 || eventQueue.length > 0} className={`bg-indigo-900 hover:bg-indigo-800 text-white px-2 py-1 rounded text-[9px] disabled:opacity-30`}>Drop</button>
                                                            <button onClick={() => dropAllStock(opId, prod.id)} disabled={modal || eventQueue.length > 0} className={`bg-green-900 hover:bg-green-800 text-white px-1 py-1 rounded text-[9px] disabled:opacity-30 flex items-center justify-center`} title="Drop All"><ArrowDownCircle size={12}/></button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )})}
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-gray-950 p-2 rounded text-center border border-gray-800">
                                            <div className="text-[10px] text-gray-500 mb-1">Safe Revenue</div>
                                            <div className="text-lg font-mono text-green-400 mb-1">{formatMoney(op.cash)}</div>
                                            <button onClick={() => manageOp_Collect(opId)} disabled={op.cash <= 0 || modal || eventQueue.length > 0} className="w-full bg-green-800 hover:bg-green-700 text-white text-[10px] py-1 rounded disabled:opacity-50">Collect (Instant)</button>
                                        </div>
                                        <div className="bg-gray-900 p-2 rounded text-center border border-gray-800 flex flex-col justify-center">
                                            <div className="text-[10px] text-gray-500 mb-1">Heat Risk</div>
                                            <div className={`text-lg font-mono font-bold ${op.risk > 50 ? 'text-red-500' : 'text-yellow-500'}`}>{Math.floor(op.risk)}%</div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-2">
                                        {OPERATION_TYPES[op.type].name === 'Luxury Rental' && !op.hasGrow && (
                                            <button onClick={() => installGrow(opId)} disabled={modal || eventQueue.length > 0} className="w-full border border-dashed border-green-800 text-green-600 p-1 rounded text-[10px] hover:bg-green-900/20 disabled:opacity-30">+ Grow (£2k)</button>
                                        )}
                                        <button onClick={() => shutdownOp(opId, 'ask')} disabled={modal || eventQueue.length > 0} className={`w-full border border-dashed border-red-800 text-red-500 p-1 rounded text-[10px] hover:bg-red-900/20 disabled:opacity-30 ${OPERATION_TYPES[op.type].name === 'Luxury Rental' && !op.hasGrow ? '' : 'col-span-2'}`}><Ban size={10} className="inline mr-1"/>Shut Down</button>
                                    </div>
                                </div>
                            ))}
                            </div>
                            <div className="pt-4 border-t border-gray-800">
                                <h4 className="text-sm text-gray-400 font-bold mb-2 uppercase">Establish New Line</h4>
                                {location.type === 'city' ? (
                                    <div className="text-red-400 text-xs bg-red-900/20 p-2 rounded text-center">Can't set up in the City. Go Country.</div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                        {Object.entries(OPERATION_TYPES).map(([key, type]) => (
                                            <button key={key} onClick={() => setupOperation(key)} disabled={modal || eventQueue.length > 0} className="bg-gray-800 hover:bg-indigo-900/30 border border-gray-600 p-3 rounded text-left transition-all disabled:opacity-30 flex justify-between items-center">
                                                <div><div className="font-bold text-indigo-300 text-xs">{type.name}</div><div className="text-[9px] text-gray-500">{type.description}</div></div>
                                                <div className="text-right"><div className="text-xs font-mono text-white">{key === 'street' ? 'Free' : formatMoney(type.cost)}</div></div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    )}

                    {/* FINANCES TAB */}
                    {activeTab === 'finances' && (
                        <div className="space-y-6">
                            <h2 className="text-xl font-bold text-white">Finances & Laundering</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-gray-900 p-4 rounded-lg border border-gray-800 text-center"><div className="text-gray-500 text-xs mb-1">Cash (Seizable)</div><div className="text-xl font-bold text-green-400 mb-1">{formatMoney(cash)}</div><div className="text-[10px] text-gray-600">Dirty Money</div></div>
                                <div className="bg-gray-900 p-4 rounded-lg border border-gray-800 text-center"><div className="text-gray-500 text-xs mb-1">Bank (Safe)</div><div className="text-xl font-bold text-blue-400 mb-1">{formatMoney(bank)}</div><div className="text-[10px] text-gray-600">Earns 0.01% Daily</div></div>
                            </div>
                            <div className="bg-gray-900 p-4 rounded-lg border border-gray-800"><h3 className="font-bold text-white text-xs uppercase mb-3">Vitals</h3><div className="grid grid-cols-3 gap-2 text-center text-xs"><div className="bg-gray-800 p-2 rounded"><div className="text-gray-500">Stress</div><div className={`${stress > 80 ? 'text-red-500' : 'text-white'} font-bold`}>{Math.floor(stress)}%</div></div><div className="bg-gray-800 p-2 rounded"><div className="text-gray-500">Health</div><div className={`${health < 30 ? 'text-red-500' : 'text-green-500'} font-bold`}>{Math.floor(health)}%</div></div><div className="bg-gray-800 p-2 rounded"><div className="text-gray-500">Strength</div><div className="text-blue-400 font-bold">{Math.floor(strength)}</div></div></div></div>
                            <div className="bg-gray-900 p-4 rounded-lg border border-gray-800"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-white flex items-center gap-2"><Bitcoin size={16} className="text-orange-500"/> Crypto Assets</h3><div className="text-right"><div className="text-xs text-gray-500">BTC Price</div><div className="text-orange-400 font-mono">{formatMoney(btcPrice)}</div></div></div><div className="text-center mb-4"><div className="text-3xl font-black text-white">{crypto.toFixed(4)} <span className="text-sm text-gray-500">BTC</span></div><div className="text-xs text-gray-500">Value: {formatMoney(crypto * btcPrice)}</div></div><div className="grid grid-cols-2 gap-2"><button onClick={() => buyCrypto(1000)} disabled={cash < 1000 || modal || eventQueue.length > 0} className="bg-green-900/30 hover:bg-green-900/50 text-green-400 text-xs py-2 rounded border border-green-900/50">Buy £1k BTC</button><button onClick={() => sellCrypto(crypto)} disabled={crypto <= 0 || modal || eventQueue.length > 0} className="bg-red-900/30 hover:bg-red-900/50 text-red-400 text-xs py-2 rounded border border-red-900/50">Sell All BTC</button></div></div>
                            <div className="bg-gray-900 p-4 rounded-lg border border-gray-800"><h3 className="font-bold text-white flex items-center gap-2 mb-3"><RefreshCw size={16} className="text-purple-500"/> Money Laundering</h3>{location?.contact ? (<div className="bg-gray-800/50 p-3 rounded mb-4"><div className="flex justify-between items-center mb-1"><span className="text-sm font-bold text-gray-300">{location.contact.name}</span><span className="text-xs bg-purple-900 text-purple-300 px-2 py-1 rounded">Fee: {(location.contact.fee * 100).toFixed(0)}%</span></div><div className="text-xs text-gray-500 mb-3">{location.contact.desc} • Takes {(() => { const base = location.contact.time; const mod = Math.max(0.5, (1 - (skills.network.cleaner * 0.05))); return Math.max(1, Math.ceil(base * mod)); })()} hours</div><div className="mb-3"><label className="text-xs text-gray-400 block mb-1">Amount to Launder</label><div className="flex gap-2"><input type="number" value={launderAmount} onChange={(e) => setLaunderAmount(e.target.value)} placeholder={`Max: ${formatMoney(cash)}`} className="flex-1 bg-gray-900 border border-gray-700 text-white px-2 py-1 rounded text-xs" min="0" max={cash} /><button onClick={() => setLaunderAmount(cash.toString())} className="bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded text-xs">Max</button></div></div><div className="grid grid-cols-2 gap-2"><button onClick={() => { const amt = parseInt(launderAmount) || 0; if (amt > 0 && amt <= cash) launderMoney(amt); }} disabled={!launderAmount || parseInt(launderAmount) <= 0 || parseInt(launderAmount) > cash || modal || eventQueue.length > 0} className="bg-purple-700 hover:bg-purple-600 text-white text-xs py-2 rounded disabled:opacity-50">Launder</button><button onClick={() => launderMoney(cash)} disabled={cash <= 0 || modal || eventQueue.length > 0} className="bg-purple-900/50 hover:bg-purple-900 text-purple-300 text-xs py-2 rounded disabled:opacity-50 border border-purple-800">All Cash</button></div></div>) : (<div className="text-gray-500 text-xs p-4 text-center">Laundering unavailable here.</div>)}{laundering.length > 0 && (<div><div className="text-[10px] uppercase text-gray-500 font-bold mb-2">Pending Transactions</div><div className="space-y-1">{laundering.map(job => (<div key={job.id} className="flex justify-between text-xs bg-gray-950 p-2 rounded"><span className="text-gray-400">{job.location}</span><span className="text-white">{formatMoney(job.payout)}</span><span className="text-yellow-500">{job.hoursLeft}h left</span></div>))}</div></div>)}</div>
                            <div className="bg-red-900/10 p-4 rounded-lg border border-red-900/30 flex justify-between items-center"><div><div className="text-gray-500 text-xs">Total Debt</div><div className="text-xl font-black text-red-500">{formatMoney(debt)}</div>{limit && <div className="text-[10px] text-red-400">{limit - day + 1} Days Left</div>}</div><button onClick={payDebt} disabled={debt === 0 || cash === 0 || modal || eventQueue.length > 0} className="bg-red-900/50 hover:bg-red-900 text-red-300 text-xs px-4 py-2 rounded font-bold disabled:opacity-50">Pay Debt</button></div>
                            <div className="mt-8 bg-gray-900/50 p-4 rounded-lg"><h3 className="text-sm font-bold text-gray-400 mb-2">Comms Log</h3><div className="text-xs text-gray-500 space-y-1 font-mono">{logs.map((log, i) => <div key={i}>&gt; {log}</div>)}</div></div>
                            <button onClick={confirmQuit} disabled={modal || eventQueue.length > 0} className="w-full py-4 mt-4 text-sm text-red-500 font-bold hover:bg-red-900/10 border border-transparent hover:border-red-900/30 rounded flex items-center justify-center gap-2 transition-all disabled:opacity-50"><LogOut size={16} /> Quit to Menu</button>
                        </div>
                    )}
                </div>

                <div className="bg-gray-900 border-t border-gray-800 p-2 z-10 grid gap-2" style={{ gridTemplateColumns: showAdmin ? 'repeat(6, 1fr)' : 'repeat(5, 1fr)' }}>
                    <button onClick={() => setActiveTab('market')} disabled={modal || eventQueue.length > 0} className={`flex flex-col items-center justify-center p-2 rounded disabled:opacity-30 ${activeTab === 'market' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500'}`}><DollarSign size={20} /><span className="text-[10px] mt-1 font-bold">Market</span></button>
                    <button onClick={() => setActiveTab('travel')} disabled={modal || eventQueue.length > 0} className={`flex flex-col items-center justify-center p-2 rounded disabled:opacity-30 ${activeTab === 'travel' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500'}`}><Navigation size={20} /><span className="text-[10px] mt-1 font-bold">Travel</span></button>
                    {location.id !== 'lon' ? (
                        <button onClick={() => setActiveTab('empire')} disabled={modal || eventQueue.length > 0} className={`flex flex-col items-center justify-center p-2 rounded disabled:opacity-30 ${activeTab === 'empire' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500'}`}><Briefcase size={20} /><span className="text-[10px] mt-1 font-bold">Ops</span></button>
                    ) : (
                        <button disabled className="flex flex-col items-center justify-center p-2 rounded opacity-20"><Briefcase size={20} /><span className="text-[10px] mt-1 font-bold">Ops</span></button>
                    )}
                    <button onClick={() => setActiveTab('heat')} disabled={modal || eventQueue.length > 0} className={`flex flex-col items-center justify-center p-2 rounded disabled:opacity-30 ${activeTab === 'heat' ? 'text-red-400 bg-gray-800' : 'text-gray-500'}`}><Mask size={20} /><span className="text-[10px] mt-1 font-bold">Heat</span></button>
                    <button onClick={() => setActiveTab('finances')} disabled={modal || eventQueue.length > 0} className={`flex flex-col items-center justify-center p-2 rounded disabled:opacity-30 ${activeTab === 'finances' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500'}`}><Landmark size={20} /><span className="text-[10px] mt-1 font-bold">Finances</span></button>
                    {showAdmin && <button onClick={() => setActiveTab('admin')} disabled={modal || eventQueue.length > 0} className={`flex flex-col items-center justify-center p-2 rounded disabled:opacity-30 ${activeTab === 'admin' ? 'text-red-400 bg-gray-800' : 'text-gray-500'}`}><Lock size={20} /><span className="text-[10px] mt-1 font-bold">Admin</span></button>}
                </div>
            </div>
        );
    }

    // --- APP RENDER ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CountyLinesGame />);

    </script>
</body>
</html>
